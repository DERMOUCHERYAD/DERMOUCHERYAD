<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Ryad Dermouche — Cybersecurity</title>
  <desc id="desc">Dark terminal-style cybersecurity profile banner with animated scan lines and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#060B14"/><stop offset="1" stop-color="#0B1925"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#12D9A0"/><stop offset="1" stop-color="#45C5FF"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#183347" stroke-width="0.65" opacity="0.4"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1041px 123px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .scan { animation: scan 7s linear infinite; }
      .bars { animation: bars 2.7s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% {opacity:.35} 50% {opacity:.9} }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes scan { 0% {transform:translateY(-60px); opacity:0} 10% {opacity:.38} 80%{opacity:.38} 100%{transform:translateY(380px); opacity:0} }
      @keyframes bars { 0%,100% {opacity:.30} 50% {opacity:.95} }
      @media (prefers-reduced-motion: reduce) { .pulse,.blink,.scan,.bars {animation:none} }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="#000" opacity="0.09"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
    <rect class="scan" x="0" y="10" width="1200" height="12" fill="#26F5C8" opacity=".24"/>
    <rect x="28" y="25" width="1144" height="270" rx="15" fill="#080F1B" stroke="#2A4B5F" stroke-width="1" opacity=".9"/>
    <rect x="46" y="42" width="1108" height="28" rx="4" fill="#12202D"/>
    <circle cx="64" cy="56" r="5" fill="#FA6260"/><circle cx="82" cy="56" r="5" fill="#F5BD50"/><circle cx="100" cy="56" r="5" fill="#30D27D"/>
    <text x="126" y="61" font-family="monospace" font-size="13" fill="#8396A9">ryad@security: ~ / identity</text>
    <text x="65" y="110" font-family="monospace" font-size="15" fill="#2CE8B3">$ whoami</text>
    <text x="65" y="166" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1.6" fill="#EEF9FF">MOHAMMED RYAD DERMOUCHE</text>
    <text x="67" y="208" font-family="monospace" font-size="22" letter-spacing="0.3" fill="#34D9BE">CYBERSECURITY  /  GRC  /  OFFENSIVE SECURITY</text>
    <text x="67" y="245" font-family="monospace" font-size="16" fill="#8BA6B5">SORBONNE UNIVERSITÉ   •   VALEO   •   PARIS, FRANCE</text>
    <text x="67" y="278" font-family="monospace" font-size="14" fill="#7CA2AE">root@portfolio:~$ </text>
    <rect class="blink" x="213" y="265" width="9" height="16" fill="#2DE7B6"/>
    <g opacity=".42" transform="translate(1036 122)">
      <circle r="68" fill="none" stroke="#1D7495" stroke-width="1" stroke-dasharray="5 8" class="pulse"/>
      <circle r="53" fill="none" stroke="#12D9A0" stroke-width="1"/>
      <circle r="39" fill="none" stroke="#12D9A0" stroke-width="2"/>
      <path d="M0-48V48M-48 0H48" stroke="#45C5FF" stroke-width="1" opacity=".5"/>
      <path d="M0 -26L22 -15L22 13L0 27L-22 13L-22 -15Z" fill="none" stroke="#28E8C1" stroke-width="2"/>
      <path d="M0 -12V9M-12 -4L0 9L12 -4" fill="none" stroke="#28E8C1" stroke-width="2"/>
    </g>
    <g class="bars" opacity=".75"><rect x="1089" y="220" width="4" height="18" rx="1" fill="#2AE8B4"/><rect x="1100" y="208" width="4" height="30" rx="1" fill="#2AE8B4"/><rect x="1111" y="215" width="4" height="23" rx="1" fill="#2AE8B4"/><rect x="1122" y="200" width="4" height="38" rx="1" fill="#2AE8B4"/></g>
    <path d="M1010 263H1127" stroke="#244459" stroke-width="1"/><text x="1012" y="280" font-family="monospace" font-size="12" fill="#638A9D">ACCESS: PUBLIC</text>
  </g>
</svg>
